<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <header>
      <p class="eyebrow">CodeAlpha Project</p>
      <h1>Flashcard Quiz</h1>
      <p>Study smarter with interactive flashcards.</p>
    </header>

    <section class="card-area">

      <div class="flashcard">

        <div class="label">QUESTION</div>

        <div id="question" class="question"></div>

        <div id="answerWrap" class="answer-wrap hidden">
          <div class="label">ANSWER</div>
          <div id="answer" class="answer"></div>
        </div>

        <button id="showBtn">Show Answer</button>

      </div>

      <div class="progress-row">
        <span id="counter"></span>
        <div class="progress">
          <div id="progressBar"></div>
        </div>
      </div>

      <div class="controls">
        <button id="prevBtn" class="secondary">← Previous</button>
        <button id="nextBtn">Next →</button>
      </div>

      <div class="manage">
        <button id="editBtn" class="secondary">Edit</button>
        <button id="deleteBtn" class="danger">Delete</button>
        <button id="addBtn">+ Add Card</button>
      </div>

    </section>

  </main>


  <div id="modal" class="modal hidden">

    <div class="modal-box">

      <h2 id="modalTitle">Add Flashcard</h2>

      <label>
        Question
        <textarea id="questionInput" rows="4"
          placeholder="Enter your question"></textarea>
      </label>

      <label>
        Answer
        <textarea id="answerInput" rows="4"
          placeholder="Enter your answer"></textarea>
      </label>

      <div class="modal-actions">
        <button id="cancelBtn" class="secondary">Cancel</button>
        <button id="saveBtn">Save Card</button>
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
